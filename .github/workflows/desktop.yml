# Build native desktop packages (Windows / Linux / macOS) via Tauri.
# Manual only (Actions → Desktop packages → Run workflow) to save CI minutes.
# Also runs on desktop-v* tags for stable releases.
# Green runs upload downloadable installers as Actions artifacts.

name: Desktop packages

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: "Publish/refresh the desktop-nightly GitHub prerelease"
        type: boolean
        default: true

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap prepare+smoke before the native matrix (catches standalone staging bugs early).
  smoke:
    runs-on: ubuntu-latest
    name: desktop-smoke
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare standalone + smoke
        run: |
          npm run desktop:prepare
          npm run desktop:smoke

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: ""
            bundles: dmg
            os_name: macos-arm64
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            bundles: dmg
            os_name: macos-x64
          - platform: ubuntu-22.04
            rust_target: ""
            # AppImage/linuxdeploy is flaky on GHA; ship .deb from CI.
            bundles: deb
            os_name: linux-x64
          - platform: windows-latest
            rust_target: ""
            bundles: nsis,msi
            os_name: windows-x64

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.os_name }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust cross-compile target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: desktop-${{ matrix.os_name }}

      - name: Install JS dependencies
        run: npm ci

      - name: Sync EdgeTX WASM firmware
        run: npm run sync-wasm

      - name: Build desktop packages
        working-directory: apps/desktop
        env:
          DESKTOP_BUILD: "1"
          SKIP_WASM_SYNC: "1"
        shell: bash
        run: |
          set -euo pipefail
          bundles="${{ matrix.bundles }}"
          # WiX/MSI only allows numeric semver prereleases (e.g. 0.1.0-1), not
          # 0.1.0-alpha.1. Ship NSIS alone for alpha/beta/rc tags.
          if [[ "${{ matrix.os_name }}" == "windows-x64" ]] && \
             [[ "${{ github.ref_name }}" =~ (alpha|beta|rc) ]]; then
            bundles="nsis"
            echo "Prerelease tag: using Windows bundles=$bundles (MSI skipped)"
          fi
          args=(build --bundles "$bundles")
          if [ -n "${{ matrix.rust_target }}" ]; then
            args+=(--target "${{ matrix.rust_target }}")
          fi
          echo "Running: npm run tauri -- ${args[*]}"
          npm run tauri -- "${args[@]}"

      - name: Verify bundled standalone resource layout
        working-directory: apps/desktop
        run: node ./scripts/verify-bundled-standalone.mjs

      - name: Stage installers for upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p desktop-artifacts
          target_root="apps/desktop/src-tauri/target"
          if [ -n "${{ matrix.rust_target }}" ]; then
            bundle_dir="$target_root/${{ matrix.rust_target }}/release/bundle"
          else
            bundle_dir="$target_root/release/bundle"
          fi

          echo "Staging from: $bundle_dir"
          if [ ! -d "$bundle_dir" ]; then
            echo "Bundle directory missing"
            find "$target_root" -maxdepth 4 -type d -name bundle -print || true
            exit 1
          fi

          find "$bundle_dir" -type f \( \
            -name '*.dmg' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.AppImage' -o \
            -name '*.msi' -o \
            -name '*.exe' \
          \) -print0 | while IFS= read -r -d '' file; do
            cp -v "$file" desktop-artifacts/
          done

          # macOS .app bundles are directories — zip for Actions artifact download.
          find "$bundle_dir" -type d -name '*.app' -print0 | while IFS= read -r -d '' appdir; do
            base="$(basename "$appdir")"
            zip_name="${base%.app}-${{ matrix.os_name }}.app.zip"
            (cd "$(dirname "$appdir")" && zip -qry "$GITHUB_WORKSPACE/desktop-artifacts/$zip_name" "$base")
            echo "Zipped $appdir -> desktop-artifacts/$zip_name"
          done

          echo "Staged artifacts:"
          ls -lah desktop-artifacts
          test -n "$(ls -A desktop-artifacts)"

      - name: Upload platform installers
        uses: actions/upload-artifact@v5
        with:
          name: edgetx-dashboards-${{ matrix.os_name }}
          path: desktop-artifacts/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  # Aggregate matrix installers onto the rolling prerelease after a manual run.
  publish-nightly:
    needs: build
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish_nightly == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: edgetx-dashboards-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lah release-assets

      - name: Publish desktop-nightly release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-nightly
          name: Desktop nightly
          prerelease: true
          body: |
            Manually triggered desktop builds (not every `main` merge).

            Download installers from this release, or from the **Actions artifacts**
            on the corresponding Desktop packages workflow run (exact commit build).

            Platforms: Windows (NSIS/MSI), macOS (DMG arm64 + x64), Linux (deb).

            Installers include the Tauri shell, a Next.js standalone sidecar, and a portable Node binary.
            Override the embedded Node with **EDGETX_NODE_PATH** if needed.

            For a stable pilot build, use a tagged `desktop-v*` release instead of this nightly.

            Commit: ${{ github.sha }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Versioned stable release when a desktop-v* tag is pushed.
  publish-release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: edgetx-dashboards-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lah release-assets

      - name: Publish versioned desktop release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Desktop ${{ github.ref_name }}
          # alpha / beta / rc tags stay prerelease; plain desktop-vX.Y.Z is stable.
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          body: |
            Desktop build (`${{ github.ref_name }}`).

            Platforms: Windows (NSIS/MSI), macOS (DMG arm64 + x64), Linux (deb).

            Installers include the Tauri shell, a Next.js standalone sidecar, and a portable Node binary.
            Override the embedded Node with **EDGETX_NODE_PATH** if needed.

            Unsigned alpha/pilot builds may trigger OS Gatekeeper / SmartScreen warnings.

            Commit: ${{ github.sha }}

            To cut a release: `git tag desktop-vX.Y.Z && git push origin desktop-vX.Y.Z`
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
